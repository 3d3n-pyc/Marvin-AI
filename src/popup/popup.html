<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvin - Paramètres</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 class="wordmark">MARVIN<span class="wordmark-cursor">_</span></h1>
      <span class="header-subtitle">Paramètres</span>
    </header>

    <main class="popup-body">
      <form id="config-form">
        <div class="field-group">
          <label for="model">Modèle</label>
          <input
            type="text"
            id="model"
            name="model"
            placeholder="olala-v1.0-mini-7a1b"
            required
            spellcheck="false"
          />
        </div>

        <div class="field-group">
          <label for="api-key">Clé API blade.sh</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="api-key"
              name="apiKey"
              placeholder="sk-blade-…"
              required
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="toggle-key" class="btn-toggle" aria-label="Afficher la clé">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
          <p class="field-hint">
            <span id="key-saved" hidden>Clé enregistrée</span>
            <a id="key-link" href="https://blade.sh" target="_blank" rel="noreferrer">Obtenir une clé sur blade.sh
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 3h6v6"/>
                <path d="M10 14 21 3"/>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3"/>
              </svg>
            </a>
          </p>
        </div>

        <div id="status-banner" class="status-banner" role="status" hidden></div>

        <div class="form-actions">
          <button type="button" id="btn-test" class="btn btn-secondary">Tester la connexion</button>
          <button type="submit" id="btn-save" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
