name: Automated Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de version (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Build, Changelog & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Release & Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/generate-release.mjs ${{ github.event.inputs.bump || 'patch' }}

      - name: Commit & Tag Release
        id: tag_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION [skip ci]" || echo "Aucun changement git à commiter"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.tag_version.outputs.version }}"
          name: "Marvin AI v${{ steps.tag_version.outputs.version }}"
          body_path: build/release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/releases/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
