name: Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de version (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Build, Changelog & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Release & Changelog
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            node scripts/generate-release.mjs --tag "$TAG"
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_push=true" >> $GITHUB_OUTPUT
          else
            node scripts/generate-release.mjs ${{ github.event.inputs.bump || 'patch' }}
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "is_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Tag Release (Workflow Dispatch only)
        if: steps.release_step.outputs.is_push == 'false'
        run: |
          VERSION="${{ steps.release_step.outputs.version }}"
          TAG="${{ steps.release_step.outputs.tag }}"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): $TAG [skip ci]" || echo "Aucun changement git à commiter"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.release_step.outputs.tag }}"
          name: "Marvin AI ${{ steps.release_step.outputs.tag }}"
          body_path: build/release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/releases/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
